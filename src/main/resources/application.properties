spring.application.name=kkimsae-backend
spring.config.import=optional:file:./.env[.properties]

# ?? AI ??
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-4.1-mini

# MySQL ??
spring.datasource.url=jdbc:mysql://localhost:3306/kkimsae
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# ??? JPA ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=30m

jwt.refresh-token-expiration=14d

app.admin-member-ids=${ADMIN_MEMBER_IDS:}


# ?? ?? ??
app.incident-image.upload-dir=${INCIDENT_IMAGE_UPLOAD_DIR:./uploads/incident-images}

# S3
app.s3.bucket=kkimsae-incident-images
app.s3.region=${AWS_REGION:ap-northeast-2}
# ?? ??? ??
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB


